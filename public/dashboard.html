<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — Wish Yours</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <!-- Google Fonts Preconnect & High-Performance Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700;800&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- Navigation Bar -->
  <nav class="glass-nav sticky top-0 z-40 w-full px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="text-2xl">✨</span>
        <span class="text-xl font-extrabold tracking-tight text-white">Wish <span class="text-gradient">Yours</span></span>
      </a>

      <div id="navAuthSection" class="flex items-center gap-4 text-xs font-semibold">
        <!-- Auth state injected by app.js -->
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-10">

    <!-- Header & Action Row -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-white">My Celebrations 💌</h1>
        <p class="text-xs text-gray-400 mt-1">Manage your active greeting links, monitor views, and share magic.</p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex');" class="glass px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">
          Sign In / Register
        </button>
        <a href="/create" class="btn-gradient px-5 py-2.5 rounded-xl font-bold text-xs text-white shadow flex items-center gap-1.5">
          <span>+ Create New Wish</span>
        </a>
      </div>
    </div>

    <!-- Quick Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
      <div class="glass p-5 rounded-2xl border border-white border-opacity-10">
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Greetings</div>
        <div id="statTotalWishes" class="text-3xl font-extrabold text-white">0</div>
      </div>
      <div class="glass p-5 rounded-2xl border border-white border-opacity-10">
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Views / Opens</div>
        <div id="statTotalViews" class="text-3xl font-extrabold text-pink-400">0</div>
      </div>
      <div class="glass p-5 rounded-2xl border border-white border-opacity-10">
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Active Public Links</div>
        <div id="statActiveLinks" class="text-3xl font-extrabold text-emerald-400">0</div>
      </div>
    </div>

    <!-- Wishes Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="userWishesList">
      <!-- Loaded dynamically via dashboard.js -->
    </div>

  </main>

  <!-- Edit Wish Modal -->
  <div id="editWishModal" class="fixed inset-0 z-50 bg-black bg-opacity-80 hidden items-center justify-center p-4">
    <div class="glass-card max-w-lg w-full p-6 sm:p-8 rounded-3xl relative">
      <button onclick="document.getElementById('editWishModal').classList.add('hidden')" class="absolute top-5 right-5 text-gray-400 hover:text-white">✕</button>
      <h3 class="text-xl font-bold text-white mb-4">Edit Greeting Details</h3>

      <input type="hidden" id="editWishSlug">
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Recipient Name</label>
          <input type="text" id="editRecipientName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Your Name</label>
          <input type="text" id="editSenderName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Message Body</label>
          <textarea id="editWishMessage" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none leading-relaxed"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button onclick="document.getElementById('editWishModal').classList.add('hidden')" class="px-4 py-2 text-xs font-semibold text-gray-400">Cancel</button>
        <button onclick="UserDashboard.saveWishEdit()" class="btn-gradient px-6 py-2.5 rounded-xl text-xs font-bold text-white">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Auth Modal (Email / Google Simulation / Local Auth) -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black bg-opacity-80 hidden items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 sm:p-8 rounded-3xl relative">
      <button onclick="document.getElementById('authModal').classList.add('hidden')" class="absolute top-5 right-5 text-gray-400 hover:text-white">✕</button>

      <div class="text-center mb-6">
        <div class="text-4xl mb-2">✨👤</div>
        <h3 class="text-xl font-bold text-white">Sign In to Wish Yours</h3>
        <p class="text-xs text-gray-400 mt-1">Keep all your personalized celebrations synced across devices.</p>
      </div>

      <form onsubmit="event.preventDefault(); const email = document.getElementById('authEmailInput').value; AuthManager.setUser({ email, name: email.split('@')[0] }); document.getElementById('authModal').classList.add('hidden'); showToast('Signed in as ' + email, 'success'); UserDashboard.loadUserWishes();" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Email Address</label>
          <input type="email" id="authEmailInput" placeholder="you@example.com" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        </div>
        <button type="submit" class="btn-gradient w-full py-3 rounded-xl text-xs font-bold text-white shadow-lg">
          Continue with Email 🚀
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/audio.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/creator.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
